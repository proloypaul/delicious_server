spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/deliciousdb
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ddl-auto: update
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 9080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1kZWxpY2lvdXMtYXBwLXRoYXQtaXMtYXQtbGVhc3QtNTEyLWJpdHMtbG9uZw==}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}             # 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

cookie:
  secure: false
  same-site: Lax
  domain: ""
