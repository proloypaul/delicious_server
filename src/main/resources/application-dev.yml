spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/deliciousdb
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ddl-auto: update
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1000ms
      connect-timeout: 1000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: 2
        max-concurrency: 5
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 9080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:3002

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1kZWxpY2lvdXMtYXBwLXRoYXQtaXMtYXQtbGVhc3QtNTEyLWJpdHMtbG9uZw==}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}             # 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

cookie:
  secure: false
  same-site: Lax
  domain: ""

rate-limit:
  login:
    max-attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:3}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:120}

notification:
  email:
    from: ${MAIL_FROM:noreply@delicious.com}
  rabbitmq:
    exchange: "delicious.notification.exchange"
    dlx-exchange: "notification.dlx.exchange"
    dlq-queue: "notification.dead-letter.queue"
    queues:
      seller-order-created: "order.seller.notification.queue"
      customer-order-dispatched: "order.customer.notification.queue"
    routing-keys:
      order-created: "order.created"
      order-dispatched: "order.dispatched"
      dlk: "notification.dlk"

