spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deliciousdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:utsha}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 1500ms
      connect-timeout: 1500ms

server:
  port: ${PORT:9080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1kZWxpY2lvdXMtYXBwLXRoYXQtaXMtYXQtbGVhc3QtNTEyLWJpdHMtbG9uZw==}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}             # 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}
  domain: ${COOKIE_DOMAIN:}

rate-limit:
  login:
    max-attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:3}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW:120}
