spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deliciousdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:utsha}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:9080}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
